# ============================================================
# vllm 统一配置文件（v0 — 基础推理）
# 命令行参数会覆盖此处的默认值
# ============================================================

# --- 模型 ---
model: "Qwen3-0.6B"

# --- 推理参数 ---
prompt: "Hello, my name is"
max_new_tokens: 200
temperature: 0.9
top_p: 0.95
top_k: 20

# --- 引擎 ---
dtype: "auto"

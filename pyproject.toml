[project]
name = "dzyy-vllm"
version = "0.1.0"
description = "A from-scratch Qwen3 v4 inference engine with tensor, pipeline, and data parallelism."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "einops>=0.8.0",
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.47/flash_attn-2.8.3+cu130torch2.13-cp312-cp312-linux_x86_64.whl",
    "flashinfer-cubin==0.6.15",
    "flashinfer-python==0.6.15",
    "huggingface-hub>=0.23.0",
    "msgspec>=0.18.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
    "pyzmq>=25.0.0",
    "safetensors>=0.4.0",
    "setuptools>=68.0.0",
    "torch==2.13.0",
    "tqdm>=4.66.0",
    "transformers>=4.51.0,<5",
    "triton>=3.0.0",
    "xxhash>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]
modelscope = [
    "modelscope>=1.20.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
flashinfer-python = { index = "flashinfer" }
flashinfer-cubin = { index = "flashinfer" }

[pytest]
testpaths = tests/unit tests/gpu tests/distributed
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = scripts .venv __pycache__
addopts = -ra --strict-markers
markers =
    unit: pure CPU / no model weights (fast)
    gpu: needs CUDA; may load a local HF model on 1 GPU
    distributed: needs >=2 GPUs + NCCL
    slow: long-running (HF compare, large VL)
filterwarnings =
    ignore:Skipping serialization of skipfiles_inline_module_allowlist:UserWarning

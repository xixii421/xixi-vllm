[pytest]
# Layout:
#   tests/unit/         CPU-only, fast
#   tests/gpu/          1× CUDA (+ local HF weights for some)
#   tests/distributed/  ≥2 GPU + NCCL (use homo_device_ids for TP)
testpaths = tests/unit tests/gpu tests/distributed
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = scripts bench .venv __pycache__ results
addopts = -ra --strict-markers
markers =
    unit: CPU-only / no model weights (fast)
    gpu: needs CUDA; may load a local HF model on 1 GPU
    distributed: needs >=2 GPUs + NCCL
    slow: long-running (large VL / HF compare)
filterwarnings =
    ignore:Skipping serialization of skipfiles_inline_module_allowlist:UserWarning
    ignore::DeprecationWarning

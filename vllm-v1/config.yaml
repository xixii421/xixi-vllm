# ============================================================
# vllm 统一配置文件（v1 — KV Cache + 前缀缓存）
# 命令行参数会覆盖此处的默认值
# ============================================================

# --- 模型 ---
model: "Qwen3-0.6B"

# --- 推理参数 ---
prompt: "Hello, my name is"
max_new_tokens: 200
temperature: 0.9
top_p: 0.95
top_k: 20

# --- 引擎 ---
enforce_eager: true  # true=eager, false=torch.compile
dtype: "auto"
context_len: 2048

# --- KV Cache (v1 新增) ---
block_size: 16
prefix_backend: "hash"  # none / hash / radix

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780" role="img">
  <title>v1 KV Cache sequence diagram</title>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #fafbfc; }
      .title { font: 700 16px sans-serif; fill: #0f172a; }
      .sub { font: 12px sans-serif; fill: #64748b; }
      .actor { font: 600 12px sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; }
      .lifeline { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .msg { font: 11px sans-serif; fill: #1e293b; }
      .msg-ret { font: 11px sans-serif; fill: #64748b; }
      .arrow { stroke: #0f172a; stroke-width: 1.35; fill: none; marker-end: url(#arr); }
      .arrow-ret { stroke: #64748b; stroke-width: 1.2; fill: none; stroke-dasharray: 3 2; marker-end: url(#arr-ret); }
      .note { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.2; }
      .note-t { font: 600 11px sans-serif; fill: #1d4ed8; }
      .loop { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 3; }
      .loop-t { font: 600 10px sans-serif; fill: #475569; }
      .num { font: 600 9px sans-serif; fill: #ffffff; }
      .num-bg { fill: #64748b; }
    ]]></style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0f172a"/>
    </marker>
    <marker id="arr-ret" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="920" height="780"/>
  <text class="title" x="28" y="32">v1 KV Cache - Module Sequence</text>
  <text class="sub" x="28" y="52">Engine sets Context -&gt; Model -&gt; Attention R/W Cache -&gt; SDPA</text>

  <g id="headers">
    <rect class="box" x="30" y="70" width="80" height="36" rx="6"/>
    <text class="actor" x="70" y="92" text-anchor="middle">User</text>

    <rect class="box" x="130" y="70" width="120" height="36" rx="6"/>
    <text class="actor" x="190" y="92" text-anchor="middle">Engine.generate</text>

    <rect class="box" x="280" y="70" width="120" height="36" rx="6"/>
    <text class="actor" x="340" y="85" text-anchor="middle">ForwardContext</text>
    <text class="sub" x="340" y="100" text-anchor="middle">set / get</text>

    <rect class="box" x="430" y="70" width="100" height="36" rx="6"/>
    <text class="actor" x="480" y="92" text-anchor="middle">model.forward</text>

    <rect class="box" x="560" y="70" width="120" height="36" rx="6"/>
    <text class="actor" x="620" y="92" text-anchor="middle">Attention</text>

    <rect class="box" x="700" y="70" width="100" height="36" rx="6"/>
    <text class="actor" x="750" y="92" text-anchor="middle">KVCache</text>

    <rect class="box" x="820" y="70" width="80" height="36" rx="6"/>
    <text class="actor" x="860" y="92" text-anchor="middle">SDPA</text>
  </g>

  <line class="lifeline" x1="70" y1="106" x2="70" y2="740"/>
  <line class="lifeline" x1="190" y1="106" x2="190" y2="740"/>
  <line class="lifeline" x1="340" y1="106" x2="340" y2="740"/>
  <line class="lifeline" x1="480" y1="106" x2="480" y2="740"/>
  <line class="lifeline" x1="620" y1="106" x2="620" y2="740"/>
  <line class="lifeline" x1="750" y1="106" x2="750" y2="740"/>
  <line class="lifeline" x1="860" y1="106" x2="860" y2="740"/>

  <g id="footers">
    <rect class="box" x="30" y="742" width="80" height="26" rx="4"/>
    <text class="actor" x="70" y="759" text-anchor="middle">User</text>
    <rect class="box" x="130" y="742" width="120" height="26" rx="4"/>
    <text class="actor" x="190" y="759" text-anchor="middle">Engine</text>
    <rect class="box" x="280" y="742" width="120" height="26" rx="4"/>
    <text class="actor" x="340" y="759" text-anchor="middle">Context</text>
    <rect class="box" x="430" y="742" width="100" height="26" rx="4"/>
    <text class="actor" x="480" y="759" text-anchor="middle">Model</text>
    <rect class="box" x="560" y="742" width="120" height="26" rx="4"/>
    <text class="actor" x="620" y="759" text-anchor="middle">Attention</text>
    <rect class="box" x="700" y="742" width="100" height="26" rx="4"/>
    <text class="actor" x="750" y="759" text-anchor="middle">KVCache</text>
    <rect class="box" x="820" y="742" width="80" height="26" rx="4"/>
    <text class="actor" x="860" y="759" text-anchor="middle">SDPA</text>
  </g>

  <rect class="note" x="130" y="118" width="720" height="26" rx="4"/>
  <text class="note-t" x="490" y="135" text-anchor="middle">1 Prefill: full prompt once, write cache[0:L]</text>

  <circle class="num-bg" cx="92" cy="160" r="8"/><text class="num" x="92" y="163" text-anchor="middle">1</text>
  <line class="arrow" x1="70" y1="160" x2="182" y2="160"/>
  <text class="msg" x="126" y="154" text-anchor="middle">generate(prompt)</text>

  <circle class="num-bg" cx="212" cy="188" r="8"/><text class="num" x="212" y="191" text-anchor="middle">2</text>
  <line class="arrow" x1="190" y1="188" x2="332" y2="188"/>
  <text class="msg" x="261" y="182" text-anchor="middle">set(prefill=True, cache_len=0)</text>

  <circle class="num-bg" cx="212" cy="216" r="8"/><text class="num" x="212" y="219" text-anchor="middle">3</text>
  <line class="arrow" x1="190" y1="216" x2="472" y2="216"/>
  <text class="msg" x="340" y="210" text-anchor="middle">forward(prompt_ids, positions[0..L-1])</text>

  <circle class="num-bg" cx="502" cy="244" r="8"/><text class="num" x="502" y="247" text-anchor="middle">4</text>
  <line class="arrow" x1="480" y1="244" x2="612" y2="244"/>
  <text class="msg" x="546" y="238" text-anchor="middle">forward(q,k,v) per layer</text>

  <circle class="num-bg" cx="598" cy="272" r="8"/><text class="num" x="598" y="275" text-anchor="middle">5</text>
  <line class="arrow" x1="620" y1="272" x2="348" y2="272"/>
  <text class="msg" x="484" y="266" text-anchor="middle">get()</text>

  <circle class="num-bg" cx="358" cy="296" r="8"/><text class="num" x="358" y="299" text-anchor="middle">6</text>
  <line class="arrow-ret" x1="340" y1="296" x2="612" y2="296"/>
  <text class="msg-ret" x="476" y="290" text-anchor="middle">return ctx</text>

  <circle class="num-bg" cx="642" cy="324" r="8"/><text class="num" x="642" y="327" text-anchor="middle">7</text>
  <line class="arrow" x1="620" y1="324" x2="742" y2="324"/>
  <text class="msg" x="681" y="318" text-anchor="middle">write(0, k, v)</text>

  <circle class="num-bg" cx="642" cy="352" r="8"/><text class="num" x="642" y="355" text-anchor="middle">8</text>
  <line class="arrow" x1="620" y1="352" x2="852" y2="352"/>
  <text class="msg" x="736" y="346" text-anchor="middle">SDPA(q,k,v, causal=True)</text>

  <circle class="num-bg" cx="842" cy="376" r="8"/><text class="num" x="842" y="379" text-anchor="middle">9</text>
  <line class="arrow-ret" x1="860" y1="376" x2="628" y2="376"/>
  <text class="msg-ret" x="744" y="370" text-anchor="middle">attn_out</text>

  <circle class="num-bg" cx="502" cy="404" r="8"/><text class="num" x="502" y="407" text-anchor="middle">10</text>
  <line class="arrow-ret" x1="480" y1="404" x2="198" y2="404"/>
  <text class="msg-ret" x="340" y="398" text-anchor="middle">hidden -&gt; sample -&gt; next_id, cache_len=L</text>

  <rect class="note" x="130" y="424" width="720" height="26" rx="4"/>
  <text class="note-t" x="490" y="441" text-anchor="middle">2 Decode: feed 1 token per step, write 1 slot + read prefix</text>

  <rect class="loop" x="118" y="458" width="744" height="248" rx="6"/>
  <text class="loop-t" x="130" y="474">loop until EOS / context full</text>

  <circle class="num-bg" cx="212" cy="494" r="8"/><text class="num" x="212" y="497" text-anchor="middle">11</text>
  <line class="arrow" x1="190" y1="494" x2="332" y2="494"/>
  <text class="msg" x="261" y="488" text-anchor="middle">set(prefill=False, cache_len)</text>

  <circle class="num-bg" cx="212" cy="522" r="8"/><text class="num" x="212" y="525" text-anchor="middle">12</text>
  <line class="arrow" x1="190" y1="522" x2="472" y2="522"/>
  <text class="msg" x="340" y="516" text-anchor="middle">forward([next_id], position=cache_len)</text>

  <circle class="num-bg" cx="502" cy="550" r="8"/><text class="num" x="502" y="553" text-anchor="middle">13</text>
  <line class="arrow" x1="480" y1="550" x2="612" y2="550"/>
  <text class="msg" x="546" y="544" text-anchor="middle">forward(q,k,v)</text>

  <circle class="num-bg" cx="598" cy="574" r="8"/><text class="num" x="598" y="577" text-anchor="middle">14</text>
  <line class="arrow" x1="620" y1="574" x2="348" y2="574"/>
  <text class="msg" x="484" y="568" text-anchor="middle">get()</text>

  <circle class="num-bg" cx="642" cy="602" r="8"/><text class="num" x="642" y="605" text-anchor="middle">15</text>
  <line class="arrow" x1="620" y1="602" x2="742" y2="602"/>
  <text class="msg" x="681" y="596" text-anchor="middle">write(pos=cache_len)</text>

  <circle class="num-bg" cx="642" cy="630" r="8"/><text class="num" x="642" y="633" text-anchor="middle">16</text>
  <line class="arrow" x1="620" y1="630" x2="742" y2="630"/>
  <text class="msg" x="681" y="624" text-anchor="middle">read(0..cache_len+1)</text>

  <circle class="num-bg" cx="732" cy="654" r="8"/><text class="num" x="732" y="657" text-anchor="middle">17</text>
  <line class="arrow-ret" x1="750" y1="654" x2="628" y2="654"/>
  <text class="msg-ret" x="689" y="648" text-anchor="middle">k,v cached</text>

  <circle class="num-bg" cx="642" cy="678" r="8"/><text class="num" x="642" y="681" text-anchor="middle">18</text>
  <line class="arrow" x1="620" y1="678" x2="852" y2="678"/>
  <text class="msg" x="736" y="672" text-anchor="middle">SDPA(q, cached, causal=False)</text>

  <circle class="num-bg" cx="182" cy="706" r="8"/><text class="num" x="182" y="709" text-anchor="middle">19</text>
  <line class="arrow-ret" x1="190" y1="706" x2="78" y2="706"/>
  <text class="msg-ret" x="134" y="700" text-anchor="middle">yield token</text>
</svg>
